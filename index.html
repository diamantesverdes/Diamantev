 <link rel="manifest" href="/manifest.json" />

    <!-- Captura de errores fatales: se activa ANTES de cargar React, para poder
         mostrar en pantalla cualquier error que impida que la app arranque
         (incluyendo errores en promesas/async que un Error Boundary de React
         no puede atrapar). Muestra el error directo en el celular, sin
         necesitar consola remota ni computadora. -->
    <script>
      (function () {
        function showFatalError(err) {
          if (document.getElementById('fatal-error-box')) return
          var box = document.createElement('div')
          box.id = 'fatal-error-box'
          box.style.cssText = [
            'position:fixed', 'top:0', 'left:0', 'right:0', 'bottom:0',
            'background:#fff', 'color:#b03434', 'padding:16px',
            'font-family:monospace', 'font-size:12px', 'white-space:pre-wrap',
            'overflow:auto', 'z-index:999999', 'box-sizing:border-box'
          ].join(';')
          var msg = (err && err.stack) ? err.stack : (err && err.message) ? err.message : String(err)
          box.textContent = '⚠️ Error al cargar la app:\n\n' + msg
          document.body.appendChild(box)
        }
        window.addEventListener('error', function (e) {
          showFatalError(e.error || e.message)
        })
        window.addEventListener('unhandledrejection', function (e) {
          showFatalError(e.reason)
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
